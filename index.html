<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Drone Clock — Braun Study</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --yellow: #efbb2b;
  --yellow-dk: #c69820;
  --text: #dedad1;
  --muted: #6e6a60;
  --dim: #38352c;
  --border: #242220;
  --case: #181714;
  --base: #10100e;
  --face: #0c0c0b;
  --page: #080807;
  --panel: var(--base);
  --panel2: var(--case);
  --panel-edge: var(--border);
  --panel-text: var(--text);
  --panel-muted: var(--muted);
  --face-ink: var(--text);
  --tick-minor: var(--muted);
  --tick-major: var(--text);
  --green: #2da52e;
  --red: var(--yellow-dk);
  --shadow: rgba(0,0,0,0.42);
}

html, body { min-height: 100%; }

body {
  background: #080807;
  color: var(--text);
  font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-x: hidden;
  overflow-y: auto;
}

.wrap {
  width: min(760px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.instrument {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.clock-shell {
  width: min(720px, calc(100vw - 32px));
  height: min(900px, calc(100vh - 82px));
  min-height: 650px;
  position: relative;
  background:
    radial-gradient(circle at 50% 26%, rgba(255,255,255,0.035), transparent 35%),
    linear-gradient(180deg, var(--case) 0%, var(--base) 74%, #090908 100%);
  border: 1px solid var(--border);
  border-radius: 300px 300px 42px 42px / 245px 245px 42px 42px;
  box-shadow:
    0 38px 90px rgba(0,0,0,0.52),
    inset 0 1px 0 rgba(255,255,255,0.06),
    inset 0 -16px 42px rgba(0,0,0,0.32);
  overflow: hidden;
}

.clock-shell::before {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: inherit;
  border: 1px solid rgba(222,218,209,0.035);
  background:
    linear-gradient(90deg, rgba(222,218,209,0.038), transparent 18%, transparent 82%, rgba(222,218,209,0.025));
  pointer-events: none;
}

#ring {
  position: absolute;
  left: 50%;
  top: clamp(20px, 4vh, 42px);
  transform: translateX(-50%);
  width: min(580px, 78vw, calc((100vh - 270px) * 0.92));
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 20px 24px rgba(0,0,0,0.26));
}

.side-knob {
  position: absolute;
  right: -1px;
  top: 43%;
  width: 38px;
  height: 102px;
  border-radius: 0 18px 18px 0;
  background: linear-gradient(180deg, #23211d 0%, var(--base) 100%);
  border: 1px solid var(--dim);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  padding: 0;
  text-indent: -999px;
  overflow: hidden;
  z-index: 7;
}

.side-knob:hover {
  background: linear-gradient(180deg, #2a2823 0%, #141310 100%);
}

.side-knob:active {
  transform: translateX(3px);
}

.side-knob.on {
  background: linear-gradient(180deg, var(--yellow) 0%, #916f18 100%);
  border-color: var(--yellow-dk);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    0 0 16px rgba(239,187,43,0.16);
}

.braun-logo {
  position: absolute;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  color: rgba(217,214,207,0.46);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.34em;
  line-height: 1;
  user-select: none;
}

.mode-row {
  position: absolute;
  left: 50%;
  top: calc(clamp(20px, 4vh, 42px) + min(580px, 78vw, calc((100vh - 270px) * 0.92)) - 28px);
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(3, minmax(54px, 1fr));
  gap: 8px;
  width: min(360px, calc(100% - 86px));
  z-index: 5;
}

.button-row {
  display: grid;
  grid-template-columns: 1fr 1fr 58px;
  gap: 7px;
  margin-bottom: 12px;
}

button, select {
  background: #181713;
  border: 1px solid var(--dim);
  color: var(--text);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  height: 29px;
  border-radius: 4px;
}

button {
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
}

button:hover { background: #211f1a; }
button:active { transform: translateY(1px); }

button.on {
  background: #efece4;
  color: #11110f;
  border-color: #efece4;
}

#real-btn.on {
  background: var(--yellow);
  color: #11110f;
  border-color: var(--yellow-dk);
}

#freeze-btn {
  font-size: 7px;
  letter-spacing: 0.16em;
}

#freeze-btn.on {
  background: #2b5d2a;
  color: #f3f0e7;
  border-color: #3d7f3b;
}

.cal-toggle {
  position: absolute;
  left: 34px;
  top: 49%;
  width: 42px;
  height: 28px;
  z-index: 8;
  opacity: 0.84;
}

.front-controls {
  position: absolute;
  left: 50%;
  bottom: 54px;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 88px));
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px 18px;
  padding: 18px 20px 22px;
  border-top: 1px solid rgba(222,218,209,0.10);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.025), rgba(0,0,0,0.08));
  border-radius: 0 0 24px 24px;
}

.macro {
  min-width: 0;
  display: grid;
  grid-template-columns: 82px 1fr 58px;
  align-items: center;
  gap: 12px;
  padding: 12px 12px;
  border: 1px solid rgba(222,218,209,0.075);
  border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(24,23,20,0.92), rgba(16,16,14,0.78));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.035),
    inset 0 -10px 18px rgba(0,0,0,0.16);
}

.macro .sl-lbl {
  color: var(--text);
  letter-spacing: 0.24em;
  font-size: 8px;
}

.macro .sl-val {
  color: var(--text);
  font-size: 9px;
}

.calibration-drawer {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translate(-50%, 100%);
  width: min(610px, calc(100% - 46px));
  max-height: min(72vh, 560px);
  overflow-y: auto;
  z-index: 20;
  padding: 18px 18px 20px;
  border: 1px solid rgba(222,218,209,0.12);
  border-bottom: none;
  border-radius: 18px 18px 0 0;
  background:
    linear-gradient(180deg, rgba(24,23,20,0.98), rgba(12,12,11,0.99));
  box-shadow:
    0 -18px 46px rgba(0,0,0,0.42),
    inset 0 1px 0 rgba(255,255,255,0.055);
  transition: transform 0.22s ease;
}

body.cal-open .calibration-drawer {
  transform: translate(-50%, 0);
}

.drawer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px 18px;
  padding-top: 0;
}

.panel {
  border-top: 1px solid #34342f;
  padding: 12px 0 0;
  margin-bottom: 12px;
}
.panel:first-of-type { border-top: none; padding-top: 0; }

.panel-title {
  font-size: 8px;
  line-height: 1;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--panel-muted);
  font-weight: 700;
  margin-bottom: 10px;
}

.ctrl-row {
  display: grid;
  grid-template-columns: 60px 1fr;
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
}
.ctrl-row:last-child { margin-bottom: 0; }

.ctrl-lbl,
.sl-lbl {
  font-size: 7.5px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--panel-muted);
  font-weight: 700;
}

select {
  width: 100%;
  padding: 0 7px;
  outline: none;
  border-radius: 4px;
  appearance: none;
  background:
    linear-gradient(45deg, transparent 50%, #9d9686 50%) calc(100% - 12px) 12px/5px 5px no-repeat,
    linear-gradient(135deg, #9d9686 50%, transparent 50%) calc(100% - 7px) 12px/5px 5px no-repeat,
    #24231f;
}

.sliders {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
}

.sl {
  display: grid;
  grid-template-columns: 72px 1fr 43px;
  align-items: center;
  gap: 9px;
}

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: #565146;
  outline: none;
  cursor: pointer;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #e9e4d7;
  border: 2px solid #11110f;
  box-shadow: 0 0 0 1px #6b6559;
  cursor: pointer;
}

input[type=range]::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #e9e4d7;
  border: 2px solid #11110f;
  box-shadow: 0 0 0 1px #6b6559;
  cursor: pointer;
}

.sl-val {
  font-size: 8px;
  color: #aaa292;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.legend {
  border-top: 1px solid #34342f;
  padding-top: 10px;
  font-size: 7.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--panel-muted);
  line-height: 1.85;
  font-weight: 700;
}

.legend span { color: var(--panel-text); }

.status {
  margin-top: 10px;
  font-size: 11.5px;
  color: #c6c0b3;
  min-height: 34px;
  line-height: 1.35;
  letter-spacing: 0.02em;
  text-align: center;
  width: 100%;
  max-width: 440px;
  font-weight: 500;
}
.status.active { color: #f0ece2; }

/* clock graphics */
.n-bg {
  fill: transparent;
  stroke: rgba(255,255,255,0.0);
  stroke-width: 1;
  transition: fill 0.2s, stroke 0.2s, opacity 0.2s;
}

.n-txt {
  fill: #f3f0e7;
  font-family: Helvetica, Arial, sans-serif;
  font-weight: 600;
  pointer-events: none;
  transition: fill 0.2s;
  user-select: none;
}

.n-deg {
  fill: #9f9b91;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 6.1px;
  font-weight: 700;
  letter-spacing: 0.05em;
  pointer-events: none;
  user-select: none;
  transition: fill 0.2s;
}

.n-pulse { display: none; }

.nd.in-scale .n-bg {
  stroke: rgba(255,255,255,0.22);
}

.nd.root .n-bg {
  fill: #f0ede6;
  stroke: #f0ede6;
}

.nd.root .n-txt,
.nd.root .n-deg {
  fill: #11110f;
}

.nd.interval .n-bg {
  fill: rgba(0,0,0,0.0);
  stroke: var(--yellow);
  stroke-width: 2.2;
}

.nd.interval .n-txt {
  fill: var(--yellow);
}

.nd.third .n-bg {
  stroke: rgba(239,187,43,0.62);
  stroke-width: 1.2;
  stroke-dasharray: 2 2;
}

.nd.third .n-txt {
  fill: #dfd7c6;
}

.nd.root.interval .n-bg {
  fill: #f0ede6;
}

.hand {
  transform-origin: 180px 180px;
  transition: transform 0.2s ease-out;
  stroke-linecap: round;
  pointer-events: none;
}

.hour-hand {
  stroke: #f1eee6;
  stroke-width: 6.6;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.20));
}

.minute-hand {
  stroke: #f1eee6;
  stroke-width: 4.8;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.20));
}

.second-hand {
  stroke: var(--yellow);
  stroke-width: 2;
  opacity: 1;
}

.hand-cap-under {
  fill: #6e6d67;
}

.hand-cap {
  fill: var(--yellow);
  stroke: #dfb028;
  stroke-width: 1;
}

.center-note,
.center-sub {
  opacity: 0;
  pointer-events: none;
}

.clock-shell {
  --tension: 0;
}

.clock-shell::after {
  content: "";
  position: absolute;
  left: 50%;
  top: calc(clamp(20px, 4vh, 42px) + min(580px, 78vw, calc((100vh - 270px) * 0.92)) + 14px);
  width: 104px;
  height: 2px;
  transform: translateX(-50%) scaleX(calc(0.25 + var(--tension) * 0.75));
  transform-origin: center;
  background: var(--yellow);
  opacity: calc(0.12 + var(--tension) * 0.45);
  border-radius: 999px;
  pointer-events: none;
}

@media (max-width: 720px) {
  body { padding: 10px; }
  .clock-shell {
    width: calc(100vw - 20px);
    min-height: 680px;
    height: calc(100vh - 70px);
    border-radius: 190px 190px 34px 34px / 150px 150px 34px 34px;
  }
  #ring { width: min(470px, 90vw, calc((100vh - 320px) * 0.98)); }
  .mode-row {
    top: calc(clamp(20px, 4vh, 42px) + min(470px, 90vw, calc((100vh - 320px) * 0.98)) - 22px);
    width: min(330px, calc(100% - 64px));
    gap: 6px;
  }
  .front-controls {
    width: calc(100% - 32px);
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 12px 12px 16px;
    bottom: 44px;
  }
  .macro {
    grid-template-columns: 76px 1fr 56px;
    padding: 9px 10px;
  }
  .drawer-grid { grid-template-columns: 1fr; }
}

@media (max-height: 720px) and (min-width: 760px) {
  .clock-shell {
    width: min(660px, calc(100vw - 32px));
    height: calc(100vh - 64px);
    min-height: 620px;
  }
  #ring { width: min(500px, calc((100vh - 250px) * 0.94)); }
  .mode-row {
    top: calc(clamp(20px, 4vh, 42px) + min(500px, calc((100vh - 250px) * 0.94)) - 28px);
  }
  .front-controls { bottom: 48px; }
}

/* Object-layout override from the compact chronometer direction */
body {
  background: #080807;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 12px 28px;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(40,38,32,0.35) 0%, transparent 60%);
  pointer-events: none;
}

.wrap {
  width: min(520px, 100%);
}

.instrument {
  position: relative;
  width: min(520px, 100%);
  display: block;
  background: linear-gradient(168deg, #1e1d19 0%, #131210 55%, #0d0d0b 100%);
  border: 1px solid #28261e;
  border-radius: 232px 232px 18px 18px / 188px 188px 18px 18px;
  box-shadow:
    0 48px 90px rgba(0,0,0,0.60),
    0 16px 32px rgba(0,0,0,0.40),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 -2px 0 rgba(0,0,0,0.5);
  --tension: 0;
}

.clock-shell {
  width: auto;
  height: auto;
  min-height: 0;
  position: relative;
  background: transparent;
  border: none;
  border-radius: inherit;
  box-shadow: none;
  overflow: visible;
}

.clock-shell::before { display: none; }

.instrument::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 434px;
  width: 72px;
  height: 2px;
  transform: translateX(-50%) scaleX(calc(0.18 + var(--tension) * 0.82));
  transform-origin: center;
  background: var(--yellow);
  opacity: calc(0.08 + var(--tension) * 0.58);
  border-radius: 999px;
  pointer-events: none;
  transition: opacity 0.4s;
}

.clock-shell::after { display: none; }

.face-region {
  position: relative;
  height: 442px;
  overflow: visible;
}

#ring {
  position: absolute;
  left: 45px;
  top: 12px;
  width: 430px;
  height: 430px;
  transform: none;
  overflow: visible;
  filter: none;
}

.side-knob {
  position: absolute;
  right: -13px;
  top: 202px;
  width: 26px;
  height: 66px;
  border-radius: 0 13px 13px 0;
  background: linear-gradient(180deg, #232118 0%, #0d0d0b 100%);
  border: 1px solid #302e26;
  border-left: none;
  box-shadow: 2px 0 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  cursor: ns-resize;
  z-index: 2;
}

.side-knob::before {
  content: "";
  position: absolute;
  inset: 10px 4px;
  background: repeating-linear-gradient(180deg, transparent 0px, transparent 4px, rgba(255,255,255,0.06) 4px, rgba(255,255,255,0.06) 5px);
  border-radius: 2px;
}

.base-plate {
  background: linear-gradient(180deg, #111010 0%, #0c0c0b 100%);
  border-top: 1px solid #1e1c16;
  padding: 12px 20px 12px;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.4);
}

.row-primary {
  display: grid;
  grid-template-columns: max-content;
  justify-content: center;
  gap: 7px;
  margin-bottom: 8px;
}

.row-modes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-bottom: 9px;
}

.row-vol {
  display: grid;
  grid-template-columns: 38px 1fr 34px;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.front-macros {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px 18px;
  margin-bottom: 12px;
  padding-top: 4px;
}

button, select {
  font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  border-radius: 3px;
  cursor: pointer;
}

button {
  font-size: 7px;
  background: #1a1916;
  border: 1px solid #32302a;
  color: var(--muted);
  height: 27px;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04), inset 0 1px 3px rgba(0,0,0,0.3);
}

button:hover {
  background: #222019;
  color: var(--text);
  border-color: #46433a;
}

button:active {
  transform: translateY(1px);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}

button.on {
  background: var(--text);
  color: #0c0c0b;
  border-color: var(--text);
  box-shadow: none;
}

#start-btn:not(.side-knob) {
  position: static;
  width: auto;
  height: 27px;
  border-radius: 3px;
  text-indent: 0;
  overflow: visible;
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--muted);
}

#start-btn:not(.side-knob)::before { display: none; }

#start-btn.on {
  background: var(--yellow);
  color: #0c0c0b;
  border-color: var(--yellow-dk);
  box-shadow: 0 0 14px rgba(239,187,43,0.22);
}

#start-btn.side-knob {
  position: absolute;
  right: -1px;
  top: 218px;
  width: 26px;
  height: 66px;
  border-radius: 0 13px 13px 0;
  background: linear-gradient(180deg, #232118 0%, #0d0d0b 100%);
  border: 1px solid #302e26;
  border-left: none;
  box-shadow: 2px 0 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  cursor: pointer;
  z-index: 8;
  padding: 0;
  text-indent: -999px;
  overflow: hidden;
}

#start-btn.side-knob::before {
  content: "";
  position: absolute;
  display: block;
  inset: 10px 4px;
  background: repeating-linear-gradient(180deg, transparent 0px, transparent 4px, rgba(255,255,255,0.06) 4px, rgba(255,255,255,0.06) 5px);
  border-radius: 2px;
}

#start-btn.side-knob:hover {
  background: linear-gradient(180deg, #2a2823 0%, #141310 100%);
  border-color: #46433a;
}

#start-btn.side-knob:active {
  transform: translateX(3px);
}

#start-btn.side-knob.on {
  background: linear-gradient(180deg, var(--yellow) 0%, #916f18 100%);
  border-color: var(--yellow-dk);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 0 16px rgba(239,187,43,0.16);
}

#real-btn.on {
  background: var(--yellow);
  color: #0c0c0b;
  border-color: var(--yellow-dk);
}

#freeze-btn.on {
  background: #1e2e1e;
  color: #7abf7a;
  border-color: #364836;
  box-shadow: none;
}

select {
  font-size: 7px;
  background: #1a1916;
  border: 1px solid #32302a;
  color: var(--text);
  height: 27px;
  padding: 0 22px 0 7px;
  outline: none;
  appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 10px) 11px, calc(100% - 6px) 11px;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  background-color: #1a1916;
}

input[type=range] {
  height: 1.5px;
  background: #36332a;
}

input[type=range]::-webkit-slider-thumb {
  width: 11px;
  height: 11px;
  background: #d0ccc0;
  box-shadow: 0 0 0 1px #565040;
}

input[type=range]::-moz-range-thumb {
  width: 11px;
  height: 11px;
  background: #d0ccc0;
}

.expand-toggle {
  display: block;
  width: 100%;
  height: 22px;
  background: none;
  border: none;
  border-top: 1px solid #1c1a14;
  color: #3a3830;
  font-size: 6.5px;
  letter-spacing: 0.32em;
  box-shadow: none;
  border-radius: 0;
  transition: color 0.18s;
  margin-bottom: 0;
}

.row-primary .expand-toggle {
  width: 86px;
  height: 21px;
  align-self: center;
  background: transparent;
  border: 1px solid #26241e;
  color: #545048;
  font-size: 6px;
  letter-spacing: 0.20em;
  margin: 0;
}

.brand-bar .expand-toggle {
  width: auto;
  height: auto;
  align-self: center;
  justify-self: center;
  background: transparent;
  border: none;
  color: rgba(222,218,209,0.22);
  font-family: "Univers", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  line-height: 1;
  padding: 0;
  box-shadow: none;
  border-radius: 0;
  margin: 0;
}

.row-primary .expand-toggle:hover,
.row-primary .expand-toggle.open,
.brand-bar .expand-toggle:hover,
.brand-bar .expand-toggle.open {
  background: #171611;
  border-color: #3a362b;
  color: var(--muted);
}

.expand-toggle:hover,
.expand-toggle.open {
  color: var(--muted);
  background: none;
  transform: none;
  box-shadow: none;
}

.expand-toggle.open {
  border-bottom: 1px solid #1c1a14;
}

.advanced {
  display: none;
  padding-top: 14px;
}

.advanced.open { display: block; }

.adv-selects {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 12px;
}

.engine-row {
  display: grid;
  grid-template-columns: 34px 1fr 34px;
  align-items: center;
  gap: 8px;
  margin-bottom: 3px;
}

.engine-row input[type=range] {
  height: 2px;
  background: linear-gradient(90deg, #3a3830 0%, #5a5030 100%);
}

.engine-row input[type=range]::-webkit-slider-thumb {
  background: var(--yellow);
  box-shadow: 0 0 0 1px #8a6a10, 0 0 7px rgba(239,187,43,0.35);
  width: 13px;
  height: 13px;
  border-color: #0c0c0b;
}

.engine-row input[type=range]::-moz-range-thumb {
  background: var(--yellow);
  border: 2px solid #0c0c0b;
}

.engine-lbl {
  font-size: 6.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--muted);
}

.engine-lbl.r {
  color: var(--yellow);
  text-align: right;
}

.engine-val {
  text-align: center;
  font-size: 6.5px;
  letter-spacing: 0.26em;
  color: var(--yellow);
  margin-bottom: 12px;
  text-transform: uppercase;
}

.sliders-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px 18px;
}

.sl {
  display: grid;
  grid-template-columns: 48px 1fr 32px;
  align-items: center;
  gap: 6px;
}

.sl-lbl {
  font-size: 6.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

.sl-val {
  font-size: 7px;
  color: var(--muted);
  font-weight: 700;
  text-align: right;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.brand-bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 8px 20px 10px;
  border-top: 1px solid #181610;
}

.braun-logo {
  position: static;
  transform: none;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: #a8a49c;
  user-select: none;
}

.snooze-control {
  display: flex;
  align-items: center;
  justify-self: end;
  gap: 7px;
  color: #77736a;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  user-select: none;
}

.snooze-light {
  width: 18px;
  height: 18px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid #172316;
  background:
    radial-gradient(circle at 36% 30%, rgba(255,255,255,0.18), transparent 28%),
    linear-gradient(145deg, #10200f, #071006);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.08),
    inset 0 -2px 4px rgba(0,0,0,0.65);
}

.snooze-light:hover {
  background:
    radial-gradient(circle at 36% 30%, rgba(255,255,255,0.22), transparent 28%),
    linear-gradient(145deg, #173016, #0a1609);
}

.snooze-light.on {
  border-color: #244d20;
  background:
    radial-gradient(circle at 36% 30%, rgba(255,255,255,0.42), transparent 24%),
    linear-gradient(145deg, #39b833, #0e4f10);
  box-shadow:
    0 0 12px rgba(45,165,46,0.42),
    inset 0 1px 2px rgba(255,255,255,0.22),
    inset 0 -2px 5px rgba(0,0,0,0.42);
}

.status {
  margin-top: 8px;
  font-size: 10.5px;
  color: #504e48;
  min-height: 28px;
  line-height: 1.45;
  letter-spacing: 0.04em;
  text-align: center;
  max-width: 520px;
}

.status.active { color: #8a8680; }

.center-note,
.center-sub {
  opacity: 0;
  pointer-events: none;
}

@media (max-width: 620px) {
  .instrument {
    width: 100%;
    border-radius: 50vw 50vw 18px 18px / 40vw 40vw 18px 18px;
  }
  #ring {
    left: 16px;
    width: calc(100% - 32px);
    height: auto;
  }
  .face-region {
    height: auto;
    min-height: 440px;
  }
  .instrument::after { top: 440px; }
  .row-modes {
    grid-template-columns: repeat(3, 1fr);
  }
  .sliders-grid,
  .front-macros,
  .adv-selects {
    grid-template-columns: 1fr;
  }
}

/* ── Dark theme restoration + Braun physical hardware controls ─────── */

:root {
  --yellow:      #efbb2b;
  --yellow-dk:   #c69820;
  --text:        #dedad1;
  --muted:       #6e6a60;
  --dim:         #38352c;
  --border:      #242220;
  --case:        #181714;
  --base:        #10100e;
  --face:        #0c0c0b;
  --page:        #080807;
  --panel-muted: #6e6a60;
  --panel-text:  #dedad1;
  --green:       #2da52e;
  --red:         var(--yellow-dk);
}

html, body, button, select, input {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}

body {
  background: #080807;
  color: var(--text);
}

body::before {
  background: radial-gradient(ellipse 65% 38% at 50% 0%, rgba(28,26,20,0.55) 0%, transparent 60%);
}

/* ── Instrument housing ─────────────────────────────────────────────── */

.instrument {
  background: linear-gradient(168deg, #1e1d19 0%, #131210 55%, #0d0d0b 100%);
  border-color: #232118;
  box-shadow:
    0 48px 90px rgba(0,0,0,0.72),
    0 16px 32px rgba(0,0,0,0.52),
    inset 0 1px 0 rgba(255,255,255,0.06),
    inset 0 -2px 0 rgba(0,0,0,0.7);
}

.instrument::after { background: var(--yellow); }

#face-fill            { fill: #0c0c0b; }
#face-rim-outer       { stroke: #484640; stroke-width: 1.2; }
#face-rim-inner       { stroke: #1e1c18; stroke-width: 0.8; }

/* ── Note ring ──────────────────────────────────────────────────────── */

.n-bg                              { stroke: rgba(255,255,255,0); }
.nd.in-scale .n-bg                 { stroke: rgba(255,255,255,0.22); }
.nd.root .n-bg                     { fill: #f0ede6; stroke: #f0ede6; }
.nd.root .n-txt, .nd.root .n-deg   { fill: #11110f; }
.nd.interval .n-bg                 { stroke: var(--yellow); stroke-width: 2.2; }
.nd.interval .n-txt                { fill: var(--yellow); }
.nd.third .n-bg                    { stroke: rgba(239,187,43,0.62); }
.n-txt                             { fill: #f3f0e7; font-weight: 600; }
.n-deg                             { fill: #9f9b91; }

/* ── Clock hands ────────────────────────────────────────────────────── */

.hour-hand, .minute-hand { stroke: #e8e1d6; filter: none; }
.second-hand              { stroke: var(--yellow); stroke-width: 2; }
.hand-cap-under           { fill: #6e6d67; }
.hand-cap                 { fill: var(--yellow); stroke: var(--yellow-dk); }

/* ── Base plate & brand ─────────────────────────────────────────────── */

.base-plate {
  background: linear-gradient(180deg, #111010 0%, #0c0c0b 100%);
  border-top-color: #1e1c16;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.5);
}

.brand-bar {
  background: #0a0a09;
  border-top-color: #181610;
}

.braun-logo {
  color: #48443e;
  font-size: 17px;
  letter-spacing: 0.035em;
}

/* ── Buttons — recessed cavity, tactile press ───────────────────────── */

button, select {
  text-transform: uppercase;
  letter-spacing: 0.13em;
  border-radius: 4px;
}

button {
  background: #1c1a16;
  border: 1px solid #2e2b24;
  color: #58544e;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04),
    inset 0 1px 5px rgba(0,0,0,0.55),
    inset 0 -1px 0 rgba(255,255,255,0.025);
}

button:hover {
  background: #252320;
  color: var(--text);
  border-color: #403d36;
}

button:active {
  transform: translateY(1px);
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.80);
}

button.on {
  background: #d4d0c8;
  color: #0c0c0b;
  border-color: #a4a09a;
  box-shadow:
    inset 0 2px 5px rgba(0,0,0,0.22),
    inset 0 -1px 0 rgba(255,255,255,0.14);
}

#real-btn.on,
#start-btn:not(.side-knob).on {
  background: var(--yellow);
  color: #0c0c0b;
  border-color: var(--yellow-dk);
  box-shadow:
    0 0 14px rgba(239,187,43,0.22),
    inset 0 1px 0 rgba(255,255,255,0.22),
    inset 0 -1px 3px rgba(0,0,0,0.30);
}

#freeze-btn.on {
  background: #192819;
  color: #78bc78;
  border-color: #2c4a2c;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.50);
}

button:focus-visible,
select:focus-visible,
input[type=range]:focus-visible {
  outline: 2px solid rgba(239,187,43,0.38);
  outline-offset: 2px;
}

/* ── Selects ────────────────────────────────────────────────────────── */

select {
  background-color: #1c1a16;
  border: 1px solid #2e2b24;
  color: var(--text);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 10px) 11px, calc(100% - 6px) 11px;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}

/* ── Expand toggle ──────────────────────────────────────────────────── */

.row-primary .expand-toggle,
.expand-toggle {
  background: transparent;
  border-color: #26231c;
  color: #44413a;
  box-shadow: none;
}

.row-primary .expand-toggle:hover,
.row-primary .expand-toggle.open,
.brand-bar .expand-toggle:hover,
.brand-bar .expand-toggle.open,
.expand-toggle:hover,
.expand-toggle.open {
  background: #161410;
  color: var(--muted);
  border-color: #38352c;
}

.advanced { border-top: 1px solid #1e1c16; }

/* calibrate button in brand-bar: bare-text, no box on hover */
.brand-bar .expand-toggle:hover,
.brand-bar .expand-toggle.open {
  background: transparent;
  border: none;
  box-shadow: none;
  transform: none;
  color: rgba(222,218,209,0.42);
}


/* ── Slider labels ──────────────────────────────────────────────────── */

.sl-lbl, .ctrl-lbl, .engine-lbl { color: var(--muted); font-weight: 700; }
.sl-val                          { color: #888480; font-weight: 700; }
.engine-lbl.r                    { color: var(--yellow); }
.engine-val                      { color: var(--yellow); margin-bottom: 10px; }
.snooze-control                  { color: var(--muted); }

/* ── Slider track — deep recessed channel ───────────────────────────── */

input[type=range] {
  height: 2px;
  background: #141210;
  box-shadow:
    inset 0 1px 4px rgba(0,0,0,1),
    0 1px 0 rgba(255,255,255,0.022);
  border-radius: 1px;
}

/* ── Slider thumb — milled aluminum cap ─────────────────────────────── */
/* Horizontal microgrooves suggest a physical grip surface              */

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  background:
    repeating-linear-gradient(
      180deg,
      rgba(0,0,0,0)    0px,
      rgba(0,0,0,0)    2.5px,
      rgba(0,0,0,0.11) 2.5px,
      rgba(0,0,0,0.11) 3px
    ),
    linear-gradient(160deg,
      #cac6be 0%,
      #9e9a94 35%,
      #6e6a64 62%,
      #8e8a84 100%
    );
  border: 1px solid #201e18;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.82),
    inset 0 1px 0 rgba(255,255,255,0.26),
    inset 0 -1px 0 rgba(0,0,0,0.42);
  cursor: pointer;
}

input[type=range]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  background: linear-gradient(160deg, #cac6be 0%, #9e9a94 35%, #6e6a64 62%, #8e8a84 100%);
  border: 1px solid #201e18;
  box-shadow: 0 2px 6px rgba(0,0,0,0.82);
  cursor: pointer;
}

/* ── Engine slider — gold-tinted cap ───────────────────────────────── */

.engine-row input[type=range] {
  background: linear-gradient(90deg, #141210 0%, #38300e 100%);
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.95);
}

.engine-row input[type=range]::-webkit-slider-thumb {
  background:
    repeating-linear-gradient(
      180deg,
      rgba(0,0,0,0)    0px,
      rgba(0,0,0,0)    2.5px,
      rgba(0,0,0,0.10) 2.5px,
      rgba(0,0,0,0.10) 3px
    ),
    linear-gradient(160deg,
      #f4d870 0%,
      #d4a822 35%,
      #a87e10 62%,
      #d0a030 100%
    );
  border-color: #7a5a0e;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.72),
    0 0 10px rgba(239,187,43,0.32),
    inset 0 1px 0 rgba(255,255,255,0.32),
    inset 0 -1px 0 rgba(0,0,0,0.38);
}

.engine-row input[type=range]::-moz-range-thumb {
  background: linear-gradient(160deg, #f4d870 0%, #d4a822 35%, #a87e10 62%, #d0a030 100%);
  border: 1px solid #7a5a0e;
}

/* ── Side winder — watch crown with knurling ────────────────────────── */
/* Cylinder viewed from side: deep shadow left, bright highlight at    */
/* ~20%, falling off to the right. Knurling lines run circumferentially */

#start-btn.side-knob {
  background:
    repeating-linear-gradient(
      180deg,
      transparent              0px,
      transparent              2.5px,
      rgba(255,255,255,0.052)  2.5px,
      rgba(255,255,255,0.052)  3.5px
    ),
    linear-gradient(90deg,
      #0c0b09  0%,
      #252218  8%,
      #4a4640  18%,
      #302c24  30%,
      #1c1a14  52%,
      #131210  76%,
      #0c0b09  100%
    );
  border-color: #302e26;
  box-shadow:
    3px 0 12px rgba(0,0,0,0.72),
    inset -3px 0 7px rgba(0,0,0,0.58),
    inset 1px 0 2px rgba(255,255,255,0.055);
}

#start-btn.side-knob::before {
  background: repeating-linear-gradient(
    180deg,
    transparent             0px,
    transparent             2.5px,
    rgba(255,255,255,0.052) 2.5px,
    rgba(255,255,255,0.052) 3.5px
  );
}

#start-btn.side-knob:hover {
  background:
    repeating-linear-gradient(
      180deg,
      transparent             0px,
      transparent             2.5px,
      rgba(255,255,255,0.070) 2.5px,
      rgba(255,255,255,0.070) 3.5px
    ),
    linear-gradient(90deg,
      #0c0b09  0%,
      #2e2a20  8%,
      #56524a  18%,
      #38342c  30%,
      #222018  52%,
      #161410  76%,
      #0c0b09  100%
    );
  border-color: #3e3a32;
}

#start-btn.side-knob.on {
  background:
    repeating-linear-gradient(
      180deg,
      transparent             0px,
      transparent             2.5px,
      rgba(255,255,255,0.092) 2.5px,
      rgba(255,255,255,0.092) 3.5px
    ),
    linear-gradient(90deg,
      #9a7410  0%,
      #efbb2b  18%,
      #fcd870  32%,
      #efbb2b  52%,
      #c89810  76%,
      #9a7010  100%
    );
  border-color: var(--yellow-dk);
  box-shadow:
    3px 0 16px rgba(239,187,43,0.30),
    inset -3px 0 7px rgba(0,0,0,0.30),
    inset 1px 0 2px rgba(255,255,255,0.20);
}

.side-start-label {
  position: absolute;
  right: 30px;
  top: 251px;
  transform: translateY(-50%) rotate(180deg);
  writing-mode: vertical-rl;
  font-family: "Univers", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.24em;
  line-height: 1;
  text-transform: uppercase;
  color: rgba(230,224,205,0.30);
  pointer-events: none;
  user-select: none;
}

body.cream-mode .side-start-label {
  color: rgba(48,44,38,0.30);
}

/* ── Snooze LED — deep glass dome ───────────────────────────────────── */

.snooze-light {
  border-color: #15200e;
  background:
    radial-gradient(circle at 36% 30%, rgba(255,255,255,0.10) 0%, transparent 42%),
    linear-gradient(145deg, #0d1a0c 0%, #050a05 100%);
  box-shadow:
    inset 0 1px 4px rgba(0,0,0,0.98),
    inset 0 -1px 1px rgba(255,255,255,0.022);
}

.snooze-light:hover {
  background:
    radial-gradient(circle at 36% 30%, rgba(255,255,255,0.16) 0%, transparent 42%),
    linear-gradient(145deg, #162414 0%, #0a1209 100%);
}

.snooze-light.on {
  border-color: #73302a;
  background:
    radial-gradient(circle at 36% 30%, rgba(255,255,255,0.56) 0%, rgba(237,63,28,0.58) 28%, transparent 58%),
    linear-gradient(145deg, #ed3f1c 0%, #7c170e 100%);
  box-shadow:
    0 0 11px rgba(237,63,28,0.50),
    0 0 26px rgba(237,63,28,0.16),
    inset 0 1px 2px rgba(255,255,255,0.40),
    inset 0 -2px 6px rgba(0,0,0,0.55);
}

/* ── Status ─────────────────────────────────────────────────────────── */

.status        { color: #3e3c36; }
.status.active { color: #8a8680; }

/* ── Final hardware tuning: mode caps + fader slots ────────────────── */

.row-modes {
  align-items: end;
}

.row-modes button {
  position: relative;
  justify-self: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  padding: 0;
  background:
    radial-gradient(circle at 50% 44%, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.14) 30%, transparent 54%),
    radial-gradient(circle at 40% 24%, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0.10) 23%, transparent 42%),
    linear-gradient(180deg, #d9d2c3 0%, #aaa296 60%, #756f66 100%);
  border: 1px solid #191711;
  color: transparent;
  font-size: 0;
  text-shadow: none;
  box-shadow:
    0 0 0 4px #050504,
    0 4px 8px rgba(0,0,0,0.56),
    inset 0 3px 7px rgba(0,0,0,0.30),
    inset 0 -2px 3px rgba(255,255,255,0.12);
}

.row-modes button::after {
  content: attr(data-label);
  position: absolute;
  left: 50%;
  top: 42px;
  transform: translateX(-50%);
  color: #7a746a;
  font-size: 6px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.row-modes button:hover {
  background:
    radial-gradient(circle at 50% 44%, rgba(0,0,0,0.24) 0%, rgba(0,0,0,0.12) 30%, transparent 54%),
    radial-gradient(circle at 40% 24%, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.12) 23%, transparent 42%),
    linear-gradient(180deg, #e7dfce 0%, #b7aea0 60%, #7e776e 100%);
}

.row-modes button:active,
.row-modes button.on,
.row-modes button.root-freeze {

function movementScaleLength() {
  return Math.max(1, scaleDegrees().length);
}

function syncLegacyClockFromMovement() {
  clock.hourPhase = movement.wheels.hour.phase;
  clock.minutePhase = movement.wheels.minute.phase;
  clock.secondPhase = movement.wheels.second.phase;
  clock.rootPhase = movement.wheels.hour.phase;
  clock.prevSecondPhase = movement.wheels.second.prevPhase;

  movement.display.hourAngle = clock.hourPhase * 360;
  movement.display.minuteAngle = clock.minutePhase * 360;
  movement.display.secondAngle = clock.secondPhase * 360;

  const shell = document.querySelector('.instrument');
  if (shell) shell.style.setProperty('--tension', movement.jumpers.interval.tension.toFixed(3));
}

function phaseInWindow(p, start, end) {
  return start < end ? (p >= start && p <= end) : (p >= start || p <= end);
}

function windowAmount(p, start, end) {
  if (!phaseInWindow(p, start, end)) return 0;
  if (start > end) {
    if (p >= start) return (p - start) / (1 - start);
    return 1 - (p / Math.max(0.0001, end));
  }
  return (p - start) / Math.max(0.0001, end - start);
}

function easeOutCubic(t) {
  const x = Math.max(0, Math.min(1, t));
  return 1 - Math.pow(1 - x, 3);
}

function resolveMovementRequests() {
  const n = movementScaleLength();

  if (movement.requests.rootHome !== null) {
    if (movement.safety.rootWindow) {
      movement.safety.pendingRootHome = movement.requests.rootHome;
    } else {
      movement.wheels.hour.phase = 0;
      movement.wheels.hour.tooth = 0;
      movement.rings.root.tooth = 0;
      movement.rings.root.target = 0;
      movement.rings.root.transition = 1;
      movement.rings.root.locked = true;
    }
    movement.requests.rootHome = null;
  }

  if (movement.requests.interval !== null) {
    const tooth = ((movement.requests.interval % n) + n) % n;

    if (movement.safety.intervalWindow && !movement.modes.freeze) {
      movement.safety.pendingInterval = tooth;
    } else {
      movement.rings.interval.target = tooth;
      movement.rings.interval.transition = 0;
      movement.rings.interval.locked = false;
      movement.rings.interval.tooth = tooth;
      movement.rings.interval.degree = tooth;
      movement.wheels.minute.tooth = tooth;
      movement.wheels.minute.phase = tooth / n;
      P.manualIntervalIndex = tooth;
    }

    movement.requests.interval = null;
  }
}

function updateMovementFromRealClock(syncHarmony = false) {
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const sec = now.getSeconds() + now.getMilliseconds() / 1000;

  movement.wheels.hour.phase = ((h + m / 60 + sec / 3600) / 12) % 1;
  movement.wheels.minute.phase = ((m + sec / 60) / 60) % 1;
  movement.wheels.second.prevPhase = movement.wheels.second.phase;
  movement.wheels.second.phase = (sec / 60) % 1;

  const roots = rootOrder();
  const n = movementScaleLength();
  const rootTooth = Math.floor(movement.wheels.hour.phase * roots.length) % Math.max(1, roots.length);
  movement.wheels.hour.tooth = rootTooth;
  movement.wheels.minute.tooth = Math.floor(movement.wheels.minute.phase * n);

  if (syncHarmony) {
    movement.rings.root.tooth = rootTooth;
    movement.rings.root.target = rootTooth;
    movement.rings.root.note = roots[rootTooth] ?? P.key;
    movement.rings.root.transition = 1;
    movement.rings.root.locked = true;
    movement.rings.interval.tooth = movement.wheels.minute.tooth;
    movement.rings.interval.target = movement.wheels.minute.tooth;
    movement.rings.interval.degree = movement.wheels.minute.tooth;
    movement.rings.interval.transition = 1;
    movement.rings.interval.locked = true;
  }
}

function updateRemontoire(dt) {
  movement.remontoire.charge -= dt / Math.max(0.08, movement.remontoire.period);

  if (movement.remontoire.charge <= 0) {
    movement.remontoire.charge = 1;
    movement.remontoire.output = 0.35 + 0.65 * secondMacroRaw();
  }

  const target = movement.remontoire.output;
  movement.remontoire.smoothed += (target - movement.remontoire.smoothed) * Math.min(1, dt * 5.0);
}

function updateSafetyWindows() {
  const s = movement.wheels.second.phase;
  const h = movement.wheels.hour.phase;

  movement.safety.intervalWindow = phaseInWindow(s, 0.88, 0.06);
  movement.safety.rootWindow = phaseInWindow(h, 0.96, 0.02);

  const tension = Math.max(
    windowAmount(s, 0.88, 0.06),
    movement.rings.interval.locked ? 0 : 0.75
  );

  movement.jumpers.interval.tension = tension;
  movement.jumpers.interval.engaged = !movement.safety.intervalWindow && movement.rings.interval.locked;
}

function updateIntervalJumper(dt, wrapped) {
  const n = movementScaleLength();

  if (wrapped && !movement.modes.freeze) {
    const next = (movement.rings.interval.tooth + 1) % n;
    movement.rings.interval.target = next;
    movement.rings.interval.transition = 0;
    movement.rings.interval.locked = false;
  }

  if (!movement.rings.interval.locked) {
    movement.rings.interval.transition += dt / 0.85;
    const t = easeOutCubic(movement.rings.interval.transition);

    if (t >= 1) {
      movement.rings.interval.tooth = movement.rings.interval.target;
      movement.rings.interval.degree = movement.rings.interval.tooth;
      movement.wheels.minute.tooth = movement.rings.interval.tooth;
      movement.wheels.minute.phase = movement.wheels.minute.tooth / n;
      P.manualIntervalIndex = movement.wheels.minute.tooth;
      movement.rings.interval.locked = true;

      if (movement.safety.pendingInterval !== null) {
        const pending = movement.safety.pendingInterval;
        movement.safety.pendingInterval = null;
        movement.requests.interval = pending;
      }
    } else {
      movement.wheels.minute.phase = movement.rings.interval.tooth / n;
    }
  } else {
    movement.wheels.minute.tooth = movement.rings.interval.tooth;
    movement.wheels.minute.phase = movement.wheels.minute.tooth / n;
  }
}

function updateRootRing(dt) {
  const roots = rootOrder();
  const rootN = Math.max(1, roots.length);
  const target = Math.floor(movement.wheels.hour.phase * rootN) % rootN;

  if (target !== movement.rings.root.tooth && movement.rings.root.locked) {
    movement.rings.root.target = target;
    movement.rings.root.transition = 0;
    movement.rings.root.locked = false;
  }

  if (!movement.rings.root.locked) {
    movement.rings.root.transition += dt / 1.4;
    if (movement.rings.root.transition >= 1) {
      movement.rings.root.tooth = movement.rings.root.target;
      movement.rings.root.locked = true;
    }
  }

  movement.rings.root.note = roots[movement.rings.root.tooth] ?? P.key;

  if (movement.safety.pendingRootHome !== null && !movement.safety.rootWindow) {
    movement.requests.rootHome = movement.safety.pendingRootHome;
    movement.safety.pendingRootHome = null;
  }
}

function updateMovementInternal(dt) {
  const before = movement.wheels.second.phase || 0;

  if (!movement.modes.snoozeRoot) {
    movement.wheels.hour.phase = (movement.wheels.hour.phase + dt * P.rate / 60) % 1;
  }
  movement.wheels.second.prevPhase = before;
  movement.wheels.second.phase = (movement.wheels.second.phase + dt * P.rate) % 1;

  const after = movement.wheels.second.phase || 0;
  const wrapped = before > 0.92 && after < 0.08;

  updateSafetyWindows();
  updateIntervalJumper(dt, wrapped);
  if (!movement.modes.snoozeRoot) updateRootRing(dt);
  updateRemontoire(dt);

  movement.wheels.second.prevPhase = after;
}

function updateThirdHandFromSecond() {
  const degs = scaleDegrees();
  const n = Math.max(1, degs.length);
  const phase = movement.wheels.second.phase || 0;
  const tooth = Math.floor(phase * n) % n;

  movement.rings.third.tooth = tooth;
  movement.rings.third.degree = tooth;
}

function updateMovement(dt = 0) {
  syncMovementModes();

  if (movement.modes.realClock) {
    updateMovementFromRealClock(false);
    updateSafetyWindows();
    updateRemontoire(dt);
  } else {
    if (dt > 0 && movement.power.running) {
      updateMovementInternal(dt);
    } else {
      updateSafetyWindows();
      updateRootRing(0);
      updateRemontoire(0);
      const n = movementScaleLength();
      movement.rings.interval.tooth = Math.max(0, Math.min(n - 1, movement.rings.interval.tooth || 0));
      movement.rings.interval.degree = movement.rings.interval.tooth;
      movement.wheels.minute.tooth = movement.rings.interval.tooth;
      movement.wheels.minute.phase = movement.wheels.minute.tooth / n;
    }
  }

  updateThirdHandFromSecond();
  resolveMovementRequests();
  syncLegacyClockFromMovement();
}

function requestMovementInterval(tooth) {
  movement.requests.interval = tooth;
  resolveMovementRequests();
  syncLegacyClockFromMovement();
}

function requestMovementRootStep(delta) {
  const roots = rootOrder();
  const n = Math.max(1, roots.length);
  movement.rings.root.tooth = ((movement.rings.root.tooth + delta) % n + n) % n;
  movement.rings.root.target = movement.rings.root.tooth;
  movement.rings.root.note = roots[movement.rings.root.tooth] ?? P.key;
  movement.wheels.hour.phase = movement.rings.root.tooth / n;
  syncLegacyClockFromMovement();
}

function requestMovementHomeKey() {
  movement.requests.rootHome = P.key;
  movement.safety.pendingRootHome = null;
  resolveMovementRequests();
  syncLegacyClockFromMovement();
}

function forceRootHome() {
  const roots = rootOrder();
  movement.safety.pendingRootHome = null;
  movement.requests.rootHome = null;
  movement.wheels.hour.phase = 0;
  movement.wheels.hour.tooth = 0;
  movement.rings.root.tooth = 0;
  movement.rings.root.target = 0;
  movement.rings.root.note = roots[0] ?? P.key;
  movement.rings.root.transition = 1;
  movement.rings.root.locked = true;
  syncLegacyClockFromMovement();
}

function engineMix() {
  const x = Math.max(0, Math.min(1, P.engine));
  return x * x * (3 - 2 * x);
}

function engineLabel(v) {
  if (v < 0.15) return 'QRTZ';
  if (v < 0.35) return 'WARM';
  if (v < 0.65) return 'AUTO';
  if (v < 0.85) return 'MECH';
  return 'MECH+';
}

function oscMixGains(v) {
  const x = Math.max(0, Math.min(1, v));
  const low = Math.cos(x * Math.PI / 2);
  const high = Math.sin(x * Math.PI / 2) * 0.68;
  return { low, high };
}

function oscMixLabel(v) {
  const g = oscMixGains(v);
  const low = Math.round(g.low * 100);
  const high = Math.round(g.high * 100);
  if (v <= 0.03) return 'LOW';
  if (v >= 0.97) return 'HIGH';
  if (Math.abs(v - 0.5) < 0.04) return 'BLEND';
  return v < 0.5 ? `LOW ${low}` : `HI ${high}`;
}

function syncRealClockPhases() {
  updateMovementFromRealClock();
  syncLegacyClockFromMovement();
}

function syncInternalClockPhases() {

function setMasterVolume(v, updateControls = true) {
  P.volume = Math.max(0, Math.min(1, Number(v)));

  if (masterOut && actx) masterOut.gain.setTargetAtTime(P.volume, actx.currentTime, 0.08);
  if (wetOut && actx) wetOut.gain.setTargetAtTime(P.volume, actx.currentTime, 0.08);

  document.documentElement.style.setProperty('--vol', P.volume.toFixed(3));

  if (updateControls) {
    const vol = document.getElementById('r-volume');
    const val = document.getElementById('v-volume');

    if (vol) vol.value = P.volume;
    if (val) val.textContent = P.volume.toFixed(2);
  }

function advanceInternalSecondClock(dt) {
  updateMovement(dt);
}

function ensureCtx() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }

  actx = new (window.AudioContext || window.webkitAudioContext)();

  masterOut = actx.createGain();
  wetOut = actx.createGain();
  recorderIn = actx.createGain();
  masterOut.gain.value = P.volume;
  wetOut.gain.value = P.volume;
  masterOut.connect(actx.destination);
  wetOut.connect(actx.destination);
  masterOut.connect(recorderIn);
  wetOut.connect(recorderIn);
  setupWavRecorder();

  convolver = actx.createConvolver();
  const sr = actx.sampleRate;
  const len = Math.floor(sr * 3.8);
  const buf = actx.createBuffer(2, len, sr);

  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      const env = Math.pow(1 - t, 1.75) * (t < 0.003 ? t / 0.003 : 1);
      const slow = Math.sin(i * 0.00045 + c * 1.8) * 0.08;
      d[i] = (Math.random() * 2 - 1 + slow) * env;
    }
  }

  convolver.buffer = buf;
  reverbIn = actx.createGain();
  reverbOut = actx.createGain();
  reverbIn.gain.value = 0.55;
  reverbOut.gain.value = P.space;

  reverbIn.connect(convolver);
  convolver.connect(reverbOut);
  reverbOut.connect(wetOut);
}

function setupWavRecorder() {
  if (!actx || recorderNode || !recorderIn) return;

  const bufferSize = 4096;
  recorderNode = actx.createScriptProcessor(bufferSize, 2, 2);
  recorderSilence = actx.createGain();
  recorderSilence.gain.value = 0;

  recorderNode.onaudioprocess = e => {
    if (!recording.active) return;

    const left = e.inputBuffer.getChannelData(0);
    const right = e.inputBuffer.numberOfChannels > 1
      ? e.inputBuffer.getChannelData(1)
      : left;

    recording.buffers[0].push(new Float32Array(left));
    recording.buffers[1].push(new Float32Array(right));
    recording.length += left.length;
  };

  recorderIn.connect(recorderNode);
  recorderNode.connect(recorderSilence);
  recorderSilence.connect(actx.destination);
}

function startWavRecording() {
  ensureCtx();
  recording.active = true;
  recording.sampleRate = actx.sampleRate;
  recording.buffers = [[], []];
  recording.length = 0;
  recording.startedAt = Date.now();
}

function mergeRecordingChannel(chunks, length) {
  const merged = new Float32Array(length);
  let offset = 0;

  chunks.forEach(chunk => {
    merged.set(chunk, offset);
    offset += chunk.length;
  });

  return merged;
}

function writeAscii(view, offset, text) {
  for (let i = 0; i < text.length; i++) {
    view.setUint8(offset + i, text.charCodeAt(i));
  }
}

function encodeWav(left, right, sampleRate) {
  const channels = 2;
  const bytesPerSample = 2;
  const blockAlign = channels * bytesPerSample;
  const dataBytes = left.length * blockAlign;
  const buffer = new ArrayBuffer(44 + dataBytes);
  const view = new DataView(buffer);

  writeAscii(view, 0, 'RIFF');
  view.setUint32(4, 36 + dataBytes, true);
  writeAscii(view, 8, 'WAVE');
  writeAscii(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeAscii(view, 36, 'data');
  view.setUint32(40, dataBytes, true);

  let offset = 44;
  for (let i = 0; i < left.length; i++) {
    const l = Math.max(-1, Math.min(1, left[i]));
    const r = Math.max(-1, Math.min(1, right[i]));
    view.setInt16(offset, l < 0 ? l * 0x8000 : l * 0x7fff, true);
    offset += 2;
    view.setInt16(offset, r < 0 ? r * 0x8000 : r * 0x7fff, true);
    offset += 2;
  }

  return new Blob([view], { type: 'audio/wav' });
}

function downloadWav(blob) {
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fm-clock-${stamp}.wav`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function stopWavRecording() {
  if (!recording.active) return;

  recording.active = false;
  if (!recording.length) return;

  const left = mergeRecordingChannel(recording.buffers[0], recording.length);
  const right = mergeRecordingChannel(recording.buffers[1], recording.length);
  downloadWav(encodeWav(left, right, recording.sampleRate));
}

function pcToFreq(pc, oct = octave) {
  const tuning = TUNINGS[P.tuning] || TUNINGS.equal;
  const octaveOffset = oct - 4;

  if (!tuning.ratios) {
    const semi = pc + octaveOffset * 12;
    return BASE_HZ * Math.pow(2, semi / 12);
  }

  const rootRatio = tuning.ratios[P.key] || Math.pow(2, P.key / 12);
  const noteRatio = tuning.ratios[pc] || Math.pow(2, pc / 12);

  let ratio = noteRatio / rootRatio;
  while (ratio < 1) ratio *= 2;
  while (ratio >= 2) ratio /= 2;

  const rootHz = BASE_HZ * Math.pow(2, P.key / 12);
  return rootHz * ratio * Math.pow(2, octaveOffset);
}

function buildVoice(freq, role) {
  const masterGain = actx.createGain();
  const filter = actx.createBiquadFilter();
  const dryGain = actx.createGain();
  const sendGain = actx.createGain();

  masterGain.gain.setValueAtTime(0, actx.currentTime);
  filter.type = 'lowpass';
  filter.frequency.value = role === 'root' ? 3200 : 4200;
  filter.Q.value = 0.35;

  dryGain.gain.value = role === 'root' ? 0.72 : 0.45;
  sendGain.gain.value = role === 'root' ? 0.52 : 0.62;

  masterGain.connect(filter);
  filter.connect(dryGain);
  filter.connect(sendGain);
  dryGain.connect(masterOut);
  sendGain.connect(reverbIn);

  const pairNodes = currentPairs().map((cfg, idx) => {
    const fc = freq * cfg.cR;
    const fm = freq * cfg.mR;
    const beta = P.shimmer * (1 + engineMix() * 1.15) * cfg.bScale;

    const carrier = actx.createOscillator();
    const upper = actx.createOscillator();
    const mod = actx.createOscillator();
    const modGain = actx.createGain();
    const pGain = actx.createGain();
    const upGain = actx.createGain();
    const lfo = actx.createOscillator();
    const lfoGain = actx.createGain();
    const pan = actx.createStereoPanner();

    carrier.type = upper.type = mod.type = lfo.type = 'sine';

    carrier.frequency.value = fc;
    upper.frequency.value = fc * 2;
    carrier.detune.value = cfg.det * P.drift;
    upper.detune.value = cfg.det * P.drift;
    mod.frequency.value = fm;
    modGain.gain.value = beta * fm;

    lfo.frequency.value = P.evolve * (0.65 + 0.18 * idx);
    lfoGain.gain.value = P.shimmer * fm * 0.16;

    mod.connect(modGain);
    modGain.connect(carrier.frequency);
    modGain.connect(upper.frequency);
    lfo.connect(lfoGain);
    lfoGain.connect(modGain.gain);

    carrier.connect(pGain);
    upper.connect(upGain);
    upGain.connect(pan);

    const oscG = oscMixGains(P.oscmix);
    const baseOut = (role === 'root' ? 1.0 : 0.72) * (cfg.gain ?? 0.22);
    pGain.gain.value = baseOut * oscG.low;
    upGain.gain.value = baseOut * oscG.high;

    pan.pan.value = role === 'root'
      ? [-0.08, 0.08, 0.0][idx]
      : [0.28, -0.23, 0.12][idx];

    pGain.connect(pan);
    pan.connect(masterGain);

    carrier.start();
    upper.start();
    mod.start();
    lfo.start();

    return { carrier, upper, mod, modGain, pGain, upGain, lfo, lfoGain, pan, fm, cfg };
  });

  const voice = {
    role,
    freq,
    masterGain,
    filter,
    pairNodes,

    on(level = 1) {
      const t = actx.currentTime;
      const amp = role === 'root' ? 0.34 : (triadMode && role === 'third' ? 0.20 : 0.24);
      masterGain.gain.cancelScheduledValues(t);
      masterGain.gain.setValueAtTime(masterGain.gain.value, t);
      masterGain.gain.linearRampToValueAtTime(amp * level, t + 2.1);
    },

    off(cb) {
      const t = actx.currentTime;
      masterGain.gain.cancelScheduledValues(t);
      masterGain.gain.setValueAtTime(masterGain.gain.value, t);
      masterGain.gain.linearRampToValueAtTime(0, t + 2.5);
      setTimeout(() => {
        pairNodes.forEach(o => {
          try { o.carrier.stop(); if (o.upper) o.upper.stop(); o.mod.stop(); o.lfo.stop(); } catch(e) {}
        });
        if (cb) cb();
      }, 2850);
    },

    setFreq(freq, glide = 1.8) {
      this.freq = freq;
      const now = actx.currentTime;
      pairNodes.forEach(o => {
        o.fm = freq * o.cfg.mR;
        o.carrier.frequency.setTargetAtTime(freq * o.cfg.cR, now, glide);
        if (o.upper) o.upper.frequency.setTargetAtTime(freq * o.cfg.cR * 2, now, glide);
        o.mod.frequency.setTargetAtTime(freq * o.cfg.mR, now, glide);
      });
    },

    setOscMix(v) {
      const now = actx.currentTime;
      const oscG = oscMixGains(v);
      pairNodes.forEach(o => {
        const baseOut = (role === 'root' ? 1.0 : 0.72) * (o.cfg.gain ?? 0.22);
        o.pGain.gain.setTargetAtTime(baseOut * oscG.low, now, 0.35);
        if (o.upGain) o.upGain.gain.setTargetAtTime(baseOut * oscG.high, now, 0.35);
      });
    },

    applyBase() {
      const now = actx.currentTime;
      pairNodes.forEach(o => {
        const beta = P.shimmer * (1 + engineMix() * 1.15) * o.cfg.bScale;
        o.modGain.gain.setTargetAtTime(beta * o.fm, now, 0.35);
        o.lfoGain.gain.setTargetAtTime(P.shimmer * o.fm * (0.16 + engineMix() * 0.08), now, 0.35);
        o.lfo.frequency.setTargetAtTime(P.evolve * (0.65 + 0.18 * pairNodes.indexOf(o)), now, 0.4);
        o.carrier.detune.setTargetAtTime(o.cfg.det * P.drift, now, 0.22);
        if (o.upper) o.upper.detune.setTargetAtTime(o.cfg.det * P.drift, now, 0.22);
      });
      this.setOscMix(P.oscmix);
      filter.frequency.setTargetAtTime(this.role === 'root' ? 3200 : 4200, now, 0.35);
    },

    applySecondHand(m) {
      const now = actx.currentTime;
      const e = engineMix();
      const modDepth = 0.78 + (m * P.orbit * (0.78 + e * 0.38));
      const driftDepth = P.drift + (m * P.orbit * (7.5 + e * 2.5));
      const evolveDepth = P.evolve * (1 + m * P.orbit * (3.6 + e * 1.1));
      const bright = (this.role === 'root' ? 2300 : 3200) + (m * P.orbit * (3600 + e * 1200));

      filter.frequency.setTargetAtTime(bright, now, 0.18);
      filter.Q.setTargetAtTime(0.28 + m * P.orbit * 0.58, now, 0.25);

      pairNodes.forEach((o, i) => {
        const beta = P.shimmer * (1 + e * 1.15) * modDepth * o.cfg.bScale;
        o.modGain.gain.setTargetAtTime(beta * o.fm, now, 0.18);
        o.lfoGain.gain.setTargetAtTime(P.shimmer * o.fm * (0.11 + m * (0.13 + e * 0.07)), now, 0.22);
        o.lfo.frequency.setTargetAtTime(evolveDepth * (0.62 + 0.2 * i), now, 0.24);
        o.carrier.detune.setTargetAtTime(o.cfg.det * driftDepth * (1 + i * 0.12), now, 0.18);
        if (o.upper) o.upper.detune.setTargetAtTime(o.cfg.det * driftDepth * (1 + i * 0.12), now, 0.18);
      });
    }
  };

  return voice;
}

function setVoice(role, pc, octOffset = 0) {
  ensureCtx();
  const freq = pcToFreq(pc, octave + octOffset);
  const id = `${pc}:${octOffset}:${P.tuning}:${P.algorithm}`;

  if (voices[role] && voices[role].id === id) return;

  const old = voices[role];
  const fresh = buildVoice(freq, role);
  const t = actx.currentTime;
  const fade = role === 'root' ? 3.8 : (role === 'third' ? 5.5 : 6.5);
  const amp = role === 'root' ? 0.34 : (triadMode && role === 'third' ? 0.20 : 0.24);

  fresh.masterGain.gain.cancelScheduledValues(t);
  fresh.masterGain.gain.setValueAtTime(0, t);
  fresh.masterGain.gain.linearRampToValueAtTime(amp, t + fade);

  fresh.id = id;
  voices[role] = fresh;

  if (old) {
    old.masterGain.gain.cancelScheduledValues(t);
    old.masterGain.gain.setValueAtTime(old.masterGain.gain.value, t);
    old.masterGain.gain.linearRampToValueAtTime(0, t + fade);
    setTimeout(() => {
      old.pairNodes.forEach(o => {
        try { o.carrier.stop(); if (o.upper) o.upper.stop(); o.mod.stop(); o.lfo.stop(); } catch(e) {}
      });
    }, Math.ceil((fade + 0.35) * 1000));
  }
}
function stopVoice(role) {
  if (!voices[role]) return;
  const old = voices[role];
  delete voices[role];
  old.off();
}

function stopAllVoices() {
  Object.keys(voices).forEach(stopVoice);
}

function scaleDegrees() {
  return SCALES[P.scale].deg;
}

function scalePcs() {
  return scaleDegrees().map(d => (P.key + d) % 12);
}

function rootOrder() {
  const allowed = scalePcs();
  const ordered = FIFTHS.map(pc => (pc + P.key) % 12).filter(pc => allowed.includes(pc));
  return ordered.length ? ordered : [P.key];
}

function degreeName(index) {
  const degs = scaleDegrees();
  const n = degs.length;
  const names7 = ['1','2','3','4','5','6','7'];
  if (n === 5) return ['1','2','3','5','6'][index % n] || String(index + 1);
  return names7[index % 7] || String(index + 1);
}

function computeClockNotes() {
  updateMovement(0);

  const roots = rootOrder();
  const degs = scaleDegrees();

  const rootIndex = movement.rings.root.tooth;
  const rootPc = movement.rings.root.note;

  const intIndex = P.realClock
    ? Math.floor(movement.wheels.minute.phase * degs.length) % degs.length
    : movement.rings.interval.tooth;

  const thirdIndex = movement.rings.third.tooth || 0;

  const rootRel = (rootPc - P.key + 12) % 12;
  const intervalPc = (rootPc + degs[intIndex]) % 12;

  let thirdPc = (rootPc + degs[thirdIndex]) % 12;
  if (thirdPc === rootPc && degs.length > 2) {
    thirdPc = (rootPc + degs[(thirdIndex + 2) % degs.length]) % 12;
  }

  active = { rootPc, intervalPc, thirdPc, rootIndex, intIndex, thirdIndex, rootRel };
}

function updateSoundFromClock() {
  computeClockNotes();

  setVoice('root', active.rootPc, -1);
  const intervalOct = active.intervalPc <= active.rootPc ? 0 : -1;
  setVoice('interval', active.intervalPc, intervalOct);

  if (triadMode) {
    const thirdOct = active.thirdPc <= active.rootPc ? 0 : -1;
    setVoice('third', active.thirdPc, thirdOct);
  } else {
    stopVoice('third');
  }

  if (reverbOut) {
    const m = secondMacro();
    reverbOut.gain.setTargetAtTime(P.space * (0.78 + m * P.orbit * 0.38), actx.currentTime, 0.18);
  }

  Object.values(voices).forEach(v => v.applySecondHand(secondMacro()));
}

function secondMacroRaw() {
  const a = movement.wheels.second.phase * Math.PI * 2;
  return 0.5 + 0.5 * Math.sin(a - Math.PI / 2);
}

function secondMacro() {
  return Math.max(0, Math.min(1, 0.35 * secondMacroRaw() + 0.65 * movement.remontoire.smoothed));
}

const SVG_NS = 'http://www.w3.org/2000/svg';
const CX = 180, CY = 180, RING_R = 138;

function buildTicks() {
  const g = document.getElementById('minute-ticks');
  if (!g || g.childNodes.length) return;

  for (let i = 0; i < 60; i++) {
    const a = (i * 6 - 90) * Math.PI / 180;
    const major = i % 5 === 0;
    const r1 = major ? 131 : 136;
    const r2 = 145;
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', CX + r1 * Math.cos(a));
    line.setAttribute('y1', CY + r1 * Math.sin(a));
    line.setAttribute('x2', CX + r2 * Math.cos(a));
    line.setAttribute('y2', CY + r2 * Math.sin(a));
    line.setAttribute('stroke', major ? '#e8e1d6' : '#8b8479');
    line.setAttribute('stroke-width', major ? '1.55' : '0.75');
    g.appendChild(line);
  }
}

function buildRing() {
  const g = document.getElementById('nodes');
  g.innerHTML = '';

  FIFTHS.forEach((pc, i) => {
    const ang = (i * 30 - 90) * Math.PI / 180;
    const nodeR = 103;
    const nx = CX + nodeR * Math.cos(ang);
    const ny = CY + nodeR * Math.sin(ang);
    const sharp = NOTES[pc].includes('♯') || NOTES[pc].includes('♭');
    const r = sharp ? 16 : 18;

    const grp = document.createElementNS(SVG_NS, 'g');
    grp.classList.add('nd');
    grp.setAttribute('data-pc', pc);
    grp.setAttribute('data-i', i);
    grp.style.cursor = 'pointer';

    const bg = document.createElementNS(SVG_NS, 'circle');
    bg.setAttribute('class', 'n-bg');
    bg.setAttribute('cx', nx);
    bg.setAttribute('cy', ny);
    bg.setAttribute('r', r);

    const txt = document.createElementNS(SVG_NS, 'text');
    txt.setAttribute('class', 'n-txt');
    txt.setAttribute('x', nx);
    txt.setAttribute('y', ny - 3);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('font-size', sharp ? '12.5' : '14.8');
    txt.setAttribute('dominant-baseline', 'middle');
    txt.textContent = NOTES[pc];

    const deg = document.createElementNS(SVG_NS, 'text');
    deg.setAttribute('class', 'n-deg');
    deg.setAttribute('x', nx);
    deg.setAttribute('y', ny + 9);
    deg.setAttribute('text-anchor', 'middle');
    deg.setAttribute('dominant-baseline', 'middle');

    grp.appendChild(bg);
    grp.appendChild(txt);
    grp.appendChild(deg);
    grp.addEventListener('click', () => manualRoot(pc));
    g.appendChild(grp);
  });

  updateScaleMarks();
}

function manualRoot(pc) {
  computeClockNotes();

  if (pc === P.key && active.rootPc !== P.key) {
    P.realClock = false;
    movement.modes.realClock = false;
    syncTimeButton();
    forceRootHome();
    computeClockNotes();
    if (running) updateSoundFromClock();
    updateVisuals();
    updateStatus();
    return;
  }

  const degs = scaleDegrees();
  const rel = (pc - active.rootPc + 12) % 12;
  const ix = degs.indexOf(rel);
  if (ix < 0) return;

  P.realClock = false;
  movement.modes.realClock = false;

  syncTimeButton();

  requestMovementInterval(ix);

  computeClockNotes();
  if (running) updateSoundFromClock();
  updateVisuals();
  updateStatus();
}

function romanForPc(pc) {
  const rel = (pc - P.key + 12) % 12;
  const map = {
    0:'I', 1:'♭II', 2:'II', 3:'♭III', 4:'III', 5:'IV',
    6:'♯IV', 7:'V', 8:'♭VI', 9:'VI', 10:'♭VII', 11:'VII'
  };
  return map[rel] || '';
}

function updateScaleMarks() {
  const allowed = scalePcs();

  document.querySelectorAll('.nd').forEach(grp => {
    const pc = +grp.getAttribute('data-pc');
    const inScale = allowed.includes(pc);
    grp.classList.toggle('in-scale', inScale);
    const deg = grp.querySelector('.n-deg');
    deg.textContent = inScale ? romanForPc(pc) : '';
  });
}

function setHandRotationContinuous(id, targetDeg, key) {
  const el = document.getElementById(id);
  if (!el) return;

  let current = clock.displayAngles[key];
  if (current === null || current === undefined || !Number.isFinite(current)) {
    current = targetDeg;
  } else {
    let diff = targetDeg - (current % 360);
    diff = ((diff + 540) % 360) - 180;
    current += diff;
  }

  clock.displayAngles[key] = current;
  el.style.transform = `rotate(${current}deg)`;
}

function updateVisuals() {
  const allowed = scalePcs();

  document.querySelectorAll('.nd').forEach(grp => {
    const pc = +grp.getAttribute('data-pc');
    grp.classList.toggle('root', pc === active.rootPc);
    grp.classList.toggle('interval', pc === active.intervalPc);
    grp.classList.toggle('third', triadMode && pc === active.thirdPc && pc !== active.intervalPc);
    grp.classList.toggle('in-scale', allowed.includes(pc));
  });

  const rootFi = FIFTHS.indexOf(active.rootPc);
  const intFi = FIFTHS.indexOf(active.intervalPc);

  const hourDeg = P.realClock ? clock.hourPhase * 360 : (rootFi >= 0 ? rootFi * 30 : 0);
  const minuteDeg = P.realClock ? clock.minutePhase * 360 : (intFi >= 0 ? intFi * 30 : 0);
  const secondDeg = clock.secondPhase * 360;

  setHandRotationContinuous('hour-hand', hourDeg, 'hour');
  setHandRotationContinuous('minute-hand', minuteDeg, 'minute');
  setHandRotationContinuous('second-hand', secondDeg, 'second');

  drawSpokes();

  const cNote = document.getElementById('ctr-note');
  const cSub = document.getElementById('ctr-sub');
  cNote.textContent = '';
  cSub.textContent = '';
  syncFrontControls();
}

function drawSpokes() {
  const spokes = document.getElementById('spokes');
  if (spokes) spokes.innerHTML = '';
}

function bindSlider(id, valId, paramKey, fmt, onchange) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(valId);

  sl.addEventListener('input', () => {
    P[paramKey] = +sl.value;
    vl.textContent = fmt(P[paramKey]);
    if (onchange) onchange(P[paramKey]);
    Object.values(voices).forEach(v => v.applyBase());
  });
}

function orbitLabel(v) {
  if (v < 0.22) return 'STILL';
  if (v < 0.52) return 'PULSE';
  if (v < 0.78) return 'ORBIT';
  return 'FLUX';
}

function syncFrontControls() {
  const root = document.getElementById('r-root-front');
  const rootVal = document.getElementById('v-root-front');
  const interval = document.getElementById('r-interval-front');
  const intervalVal = document.getElementById('v-interval-front');
  const degs = scaleDegrees();

  if (root) root.value = P.key;
  if (rootVal) rootVal.textContent = NOTES[P.key];

  if (interval) {
    interval.max = Math.max(0, degs.length - 1);
    interval.value = Math.max(0, Math.min(degs.length - 1, active.intIndex || 0));
  }
  if (intervalVal) intervalVal.textContent = `${degreeName(active.intIndex)} ${NOTES[active.intervalPc]}`;

  const orbitVal = document.getElementById('v-orbit');
  if (orbitVal) orbitVal.textContent = orbitLabel(P.orbit);

  const bellVal = document.getElementById('v-shimmer');
  if (bellVal) bellVal.textContent = P.shimmer.toFixed(2);
}

function applyKey(pc) {
  P.key = pc;
  clock.rootPhase = 0;
  P.realClock = false;
  movement.modes.realClock = false;
  syncTimeButton();
  forceRootHome();
  const keySel = document.getElementById('key-select');
  if (keySel) keySel.value = String(P.key);
  computeClockNotes();
  updateScaleMarks();
  if (running) updateSoundFromClock();
  updateVisuals();
  updateStatus();
}

function syncTimeButton() {
  const btn = document.getElementById('real-btn');
  if (!btn) return;
  const label = P.realClock ? 'time' : 'free';
  btn.classList.toggle('on', P.realClock);
  btn.dataset.label = label;
  btn.setAttribute('aria-label', `${label} mode`);
  btn.textContent = '';
}

function lockFreeClockToCurrentTimePosition() {
  updateMovementFromRealClock();

  const roots = rootOrder();
  const rootN = Math.max(1, roots.length);
  const rootTooth = Math.floor(movement.wheels.hour.phase * rootN) % rootN;
  movement.rings.root.tooth = rootTooth;
  movement.rings.root.target = rootTooth;
  movement.rings.root.note = roots[rootTooth] ?? P.key;
  movement.rings.root.transition = 1;
  movement.rings.root.locked = true;

  const n = movementScaleLength();
  const intervalTooth = Math.floor(movement.wheels.minute.phase * n) % n;
  movement.rings.interval.tooth = intervalTooth;
  movement.rings.interval.target = intervalTooth;
  movement.rings.interval.degree = intervalTooth;
  movement.rings.interval.transition = 1;
  movement.rings.interval.locked = true;
  movement.wheels.minute.tooth = intervalTooth;
  P.manualIntervalIndex = intervalTooth;
}

document.getElementById('algo-select').addEventListener('change', e => {
  P.algorithm = e.target.value;
  if (running) {
    const oldVoices = { ...voices };
    voices = {};
    updateSoundFromClock();
    Object.values(oldVoices).forEach(v => {
      const t = actx.currentTime;
      v.masterGain.gain.cancelScheduledValues(t);
      v.masterGain.gain.setValueAtTime(v.masterGain.gain.value, t);
      v.masterGain.gain.linearRampToValueAtTime(0, t + 3.2);
      setTimeout(() => {
        v.pairNodes.forEach(o => {
          try { o.carrier.stop(); if (o.upper) o.upper.stop(); o.mod.stop(); o.lfo.stop(); } catch(e) {}
        });
      }, 3600);
    });
  }
  updateStatus();
});

document.getElementById('triad-btn').addEventListener('click', () => {
  triadMode = !triadMode;
  movement.modes.triad = triadMode;
  const btn = document.getElementById('triad-btn');
  btn.classList.toggle('on', triadMode);
  btn.dataset.label = triadMode ? 'third on' : 'third';
  btn.setAttribute('aria-label', triadMode ? 'third hand on' : 'third hand');
  btn.textContent = '';
  if (running) updateSoundFromClock();
  else stopVoice('third');
  updateVisuals();
  updateStatus();
});

document.getElementById('real-btn').addEventListener('click', () => {
  const wasTime = P.realClock;

  if (wasTime) {
    lockFreeClockToCurrentTimePosition();
  }

  P.realClock = !wasTime;
  movement.modes.realClock = P.realClock;

  if (P.realClock) {
    updateMovementFromRealClock(true);
  }

  syncTimeButton();
  computeClockNotes();
  if (running) updateSoundFromClock();
  updateVisuals();
  updateStatus();
});

document.getElementById('freeze-btn').addEventListener('click', () => {
  computeClockNotes();
  const modes = ['none', 'root', 'int'];
  const ix = modes.indexOf(P.freezeMode);
  P.freezeMode = modes[(ix + 1) % modes.length];
  P.snoozeRoot = P.freezeMode === 'root' || P.freezeMode === 'int';
  P.freezeInterval = P.freezeMode === 'int';
  movement.modes.snoozeRoot = P.snoozeRoot;
  movement.modes.freeze = P.freezeInterval;

  if (P.freezeInterval) {
    requestMovementInterval(active.intIndex);
  }

  syncFreezeButton();
  if (running) updateSoundFromClock();
  updateVisuals();
  updateStatus();
});

document.getElementById('snooze-btn').addEventListener('click', () => {
  const btn = document.getElementById('snooze-btn');

  if (recording.active) {
    stopWavRecording();
  } else {
    startWavRecording();
  }

  P.recordArmed = recording.active;
  btn.classList.toggle('on', P.recordArmed);
  btn.setAttribute('aria-label', P.recordArmed ? 'Stop recording and save WAV' : 'Record WAV');
  btn.setAttribute('title', P.recordArmed ? 'stop recording and save WAV' : 'record WAV');
  updateStatus();
});

document.getElementById('theme-btn').addEventListener('click', () => {
  P.creamMode = !P.creamMode;
  const btn = document.getElementById('theme-btn');
  document.body.classList.toggle('cream-mode', P.creamMode);
  btn.classList.toggle('on', P.creamMode);
  btn.textContent = P.creamMode ? 'DARK' : 'LIGHT';
  btn.setAttribute('aria-label', P.creamMode ? 'Switch to dark mode' : 'Switch to light mode');
  btn.setAttribute('title', P.creamMode ? 'switch to dark mode' : 'switch to light mode');
});

function toggleAdvanced(force) {
  const panel = document.getElementById('adv-panel');
  const btn = document.getElementById('expand-btn');
  const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  btn.classList.toggle('open', open);
  btn.textContent = 'calibrate';
}

document.getElementById('expand-btn').addEventListener('click', () => toggleAdvanced());

document.getElementById('start-btn').addEventListener('click', () => {
  ensureCtx();
  running = !running;
  movement.power.running = running;

  const btn = document.getElementById('start-btn');
  const label = document.querySelector('.side-start-label');
  btn.classList.toggle('on', running);
  btn.setAttribute('aria-label', running ? 'Press winder to stop' : 'Press winder to start');
  btn.setAttribute('title', running ? 'press winder to stop' : 'press winder to start');
  if (label) label.textContent = running ? 'STOP' : 'START';

  if (running) {
    if (P.realClock) updateMovementFromRealClock(true);
    updateSoundFromClock();
  } else {
    stopAllVoices();
  }

  updateVisuals();
  updateStatus();
});

function updateStatus() {
  const el = document.getElementById('status');
  const thirdText = triadMode ? ` + ${NOTES[active.thirdPc]}` : '';
  const intervalText = degreeName(active.intIndex);

  if (!running) {
    const mode = P.realClock ? 'time' : 'free';
    el.textContent = `${NOTES[P.key]} ${SCALES[P.scale].name} · ${mode} · ${TUNINGS[P.tuning].name}`;
    el.classList.remove('active');
    return;
  }

  el.innerHTML =
    `droning: ${NOTES[active.rootPc]} + ${NOTES[active.intervalPc]}${thirdText}` +
    `<br>${P.realClock ? 'time' : 'free'} · interval degree ${intervalText}${P.freezeMode === 'int' ? ' · int freeze' : (P.freezeMode === 'root' ? ' · root freeze' : ' · moving')}${P.recordArmed ? ' · recording' : ''}${triadMode ? ' · second=third hand' : ' · second hand modulates FM'}`;
  el.classList.add('active');
}

function animate(ts) {
  if (!clock.last) clock.last = ts;
  const dt = Math.min(0.05, (ts - clock.last) / 1000);
  clock.last = ts;

  if (running) {
    updateMovement(dt);
    updateSoundFromClock();
  } else {
    updateMovement(0);
    computeClockNotes();
  }

  updateVisuals();
  requestAnimationFrame(animate);
}

setMasterVolume(P.volume, true);
buildTicks();
buildRing();
syncTimeButton();
syncFreezeButton();
computeClockNotes();
updateVisuals();
updateStatus();
requestAnimationFrame(animate);
</script>
</body>
</html>
